<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    .error { color: red; font-size: 0.85em; margin-top: 5px; display: block; min-height: 15px; }
  </style>
</head>
<body>

  <h2>Register</h2>
  <form id="regForm">
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="name">
      <span class="error" id="nameErr"></span>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email">
      <span class="error" id="emailErr"></span>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password">
      <span class="error" id="passErr"></span>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPass">
      <span class="error" id="confirmErr"></span>
    </div>

    <div class="form-group">
      <label>Age</label>
      <input type="number" id="age">
      <span class="error" id="ageErr"></span>
    </div>

    <button type="submit" style="padding: 10px 20px;">Submit</button>
  </form>

  <script>
    const form = document.querySelector("#regForm");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.querySelector("#name").value.trim();
      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;
      const confirmPass = document.querySelector("#confirmPass").value;
      const age = Number(document.querySelector("#age").value);

     
      document.querySelectorAll(".error").forEach(err => err.textContent = "");

      let isValid = true;

      if (name === "") {
        document.querySelector("#nameErr").textContent = "Name cannot be empty.";
        isValid = false;
      }
      if (!email.includes("@")) {
        document.querySelector("#emailErr").textContent = "Please enter a valid email containing '@'.";
        isValid = false;
      }
      if (password.length < 8) {
        document.querySelector("#passErr").textContent = "Password must be at least 8 characters.";
        isValid = false;
      }
      if (password !== confirmPass || confirmPass === "") {
        document.querySelector("#confirmErr").textContent = "Passwords do not match.";
        isValid = false;
      }
      if (isNaN(age) || age < 1) {
        document.querySelector("#ageErr").textContent = "Please enter a valid age.";
        isValid = false;
      }

      if (isValid) {
        alert("Registration Successful!");
        form.reset();
      }
    });
  </script>
</body>
</html>
